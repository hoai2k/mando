name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The suite is fourteen browser suites now — every one of them boots the
    # built game in Chromium under software rendering and plays it — and it
    # keeps growing. A job killed on the timeout reports as `cancelled`, which
    # reads exactly like a run superseded by the next push, so this once cost a
    # day of deploys that looked merely skipped: `npm test` ran 19m17s against
    # a 20-minute budget, was cut off, and every step after it — the audits,
    # the artifact, the deploy itself — was skipped in silence.
    #
    # Raised to 45 after that, and the suite has already eaten it: 2026-08-31
    # ran 41m48s, three minutes short of being killed the same way again. This
    # is meant to be headroom, not a fitted budget — if a run ever approaches
    # it, raise it again rather than trimming coverage to fit.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Boot the built game in Chromium behind a synthetic pad and play a wave
      # before publishing it — the deploy used to go out on a typecheck alone.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Every board's props measured against its colliders: nothing that looks
      # solid may be walked through, and no collider may sit on empty air.
      - run: npm run audit:boards
      # Every wave on every board, planned and measured: no hostile may be
      # posted inside the scenery it is supposed to fight in front of.
      - run: npm run audit:spawns
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
