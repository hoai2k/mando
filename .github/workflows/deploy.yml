name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 04:17 UTC nightly. Off the hour on purpose: the top of the hour is when
    # every scheduled workflow on GitHub queues at once, and a full suite that
    # starts late is a suite that reports late.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# THE BROWSER SUITES DO NOT GATE THE DEPLOY, DELIBERATELY.
#
# They used to. Everything that boots Chromium — twenty browser suites and two
# collision audits, each one playing the built game under software rendering —
# sat between the build and the publish, so a run needed the better part of an
# hour of nobody else pushing to reach the deploy step at all. With several
# sessions working on this repository that is not a wait the deploy usually
# gets: of runs 169-173, three were killed mid-suite by the next push landing
# (`cancel-in-progress`) and only one was a real failure. `main` was green and
# the live site was hours behind it, for no reason anyone could see — a
# cancelled run reads exactly like a superseded one.
#
# So the deploy now rides the build alone: `npm run build` is `tsc --noEmit &&
# vite build`, which means a tree that does not typecheck or does not bundle
# still cannot publish. That takes a couple of minutes and comfortably outruns
# the next push.
#
# THE FULL SUITE RUNS NIGHTLY, NOT ON EVERY PUSH.
#
# Taking it off the deploy path was not enough on its own. The suite took the
# better part of an hour, pushes to `main` land every twenty to fifty minutes,
# and `cancel-in-progress` killed it every time: runs 180-189 were cancelled
# without exception. So for ten consecutive pushes nobody saw a test result at
# all, which is how run 179's genuine failure sat unnoticed — and how a second
# broken check hid behind it, since the suite died before ever reaching that
# one. A signal nothing ever reads is not a signal.
#
# The split now is: every push builds, deploys, and runs a short smoke; the
# whole suite and the audits run once a night against `main`, where nothing
# supersedes them and they always finish. Whoever is changing something runs
# the suites that cover it before pushing — that is the real per-change
# coverage, and it is far better targeted than re-running everything.
#
# `npm test` is `tools/run-suites.mjs`, which serves the build once for all of
# them and runs several at a time; the nightly splits that four ways again
# across runners. See the header of that file for what the old `&&` chain of
# twenty-four `node tools/<suite>.mjs` calls was costing.
#
# AND IT SKIPS A NIGHT THAT HAS NOTHING TO TEST.
#
# `main` does not move every day, and a suite run over a tree that was already
# tested last night cannot say anything new — the same code and the same
# checks give the same answer, for the better part of an hour of runner time.
# The `changed` job below compares what is standing against what the last full
# run tested and skips everything when they are the same commit. It fails
# open: when it cannot find out, the suites run. See its header for what
# counts as the last run, and why a cancelled one does not.
jobs:
  build:
    # The nightly run is here to test, not to republish an unchanged tree.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # typecheck and bundle — the one gate the published site has
      #
      # The GATE_ENDPOINT repository variable is what turns the invite door on,
      # and THIS IS THE ONLY JOB THAT PASSES IT. The smoke and nightly jobs
      # below build without it on purpose: a suite that had to redeem an invite
      # could not run at all, and an unconfigured build has no door — see the
      # header of `src/gate/gate.ts`. Unset here too (the state of a fresh
      # fork) simply publishes the open site it always did.
      #
      # The URL is committed rather than kept in a repository variable because
      # it is not a secret: it is compiled into the published bundle, so anyone
      # who opens the site can read it anyway. Keeping it here means the door
      # needs no settings step to work, and one fewer place to look when it
      # does not. A `GATE_ENDPOINT` repository variable still wins if one is
      # set, which is the escape hatch for changing the deployment without a
      # commit.
      - run: npm run build
        env:
          VITE_GATE_ENDPOINT: ${{ vars.GATE_ENDPOINT || 'https://script.google.com/macros/s/AKfycbx5Jp9z8XG0nnk60z5zccDoIy8MdkFDr0Cn61p84fcqKyKzhZ_700c_zCJVqjwsNfvlsQ/exec' }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Deployments queue rather than cancel: two pushes in quick succession
    # should both reach Pages in order, and the later one wins by arriving
    # later. Cancelling here would be cancelling the thing we came for.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # One suite on every push: boot the built game in Chromium behind a synthetic
  # pad and play a wave. Measured at 89 s, so it lands well inside the gap
  # between pushes and usually reports rather than being superseded. It is here
  # to catch the catastrophic case — a tree that bundles but does not run — and
  # is deliberately NOT the whole suite; see the header.
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer commit supersedes an older one here, which is the right trade for
    # a quick guard: the nightly job is what guarantees a result.
    concurrency:
      group: smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the suites serve and play `dist/`, so they need it built here too
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tools/harness.mjs

  # Has anything changed since the last time the suites actually ran?
  #
  # The nightly exists to test a tree, and `main` does not move every day. A
  # run over a tree that was already tested last night burns the better part
  # of an hour of runner time to reprint a result nobody has to read: the
  # answer cannot have changed, because neither the code nor the suites did.
  # So look up what the last full run tested and compare it with what is
  # standing now — same commit, nothing to learn, and every job below skips.
  #
  # WHAT COUNTS AS THE LAST RUN. The most recent completed schedule- or
  # dispatch-triggered run of this workflow, whatever it concluded:
  #
  #   - a run that FAILED still tested the tree. Nothing has changed since, so
  #     the failure stands and re-running it says the same thing again.
  #   - a run that SKIPPED for this same reason carries the sha it skipped at,
  #     which is by definition the sha the run before it tested. The chain
  #     holds however many quiet days there are in a row.
  #   - a run that was CANCELLED did NOT finish testing, and is deliberately
  #     not counted: a timeout or a stop button must never be able to convince
  #     the next night that a tree was covered when it was not.
  #
  # Only pushes to `main` move the sha, so this is exactly "has the codebase
  # changed" — a docs-only commit does count as a change and buys a run, which
  # is the harmless side of the trade. `workflow_dispatch` always runs: asking
  # for a suite by hand is asking for it now, whatever ran last night.
  changed:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'schedule' ]; then
            echo "asked for by hand — running whatever last night did"
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # THIS GATE FAILS OPEN, DELIBERATELY. Everything below is a lookup
          # that can come back empty for reasons that have nothing to do with
          # the tree: a rate limit, a 500, a repository with no history yet.
          # Skipping is the answer to a *known* "already tested this"; not
          # knowing is an answer to nothing, and a night quietly untested
          # because an API call hiccupped is the failure mode this whole file
          # was written to end. So `last` empty means run.
          #
          # Newest first, and asked for per event because a busy week of
          # pushes would otherwise crowd every nightly off the first page.
          last=$(
            for ev in schedule workflow_dispatch; do
              gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?event=$ev&status=completed&per_page=20" \
                --jq '.workflow_runs[]
                      | select(.conclusion == "success" or .conclusion == "failure")
                      | {id, head_sha, created_at}' || true
            done | jq -rs --argjson me "${{ github.run_id }}" \
              '[.[] | select(.id != $me)] | sort_by(.created_at) | last | .head_sha // ""'
          ) || last=''
          echo "last full run tested: ${last:-<nothing found — running>}"
          echo "standing now:         ${{ github.sha }}"
          if [ -n "$last" ] && [ "$last" = "${{ github.sha }}" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing has landed on main since the last full run tested ${last}. Skipping the suites."
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  # Everything, once a night against `main` — and on demand, which is how you
  # check a tree before a big merge without waiting for the small hours.
  #
  # SPLIT ACROSS FOUR RUNNERS. One runner ran the lot in 75 minutes (run 196),
  # which is a long time to find out about a broken check and a long time for a
  # timeout to hide in. `tools/run-suites.mjs --shard=k/n` packs the suites into
  # n roughly equal piles by measured weight, so four runners finish in about
  # the time the heaviest pile takes rather than the sum of all of them.
  #
  # `fail-fast: false` is the point of the split as much as the speed is: with
  # it on, one shard failing cancels the other three, and the cancelled ones
  # report as `cancelled` — which is exactly the "a failure hid behind a
  # failure" problem the nightly job was created to end.
  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: nightly (shard ${{ matrix.shard }}/4)
    # Headroom, not a fitted budget. A job killed on the timeout reports as
    # `cancelled`, which reads exactly like a run superseded by the next push,
    # so a too-tight budget is a failure mode that hides itself — it once cost
    # a day of deploys that looked merely skipped. If a run ever approaches
    # this, raise it rather than trimming coverage to fit.
    timeout-minutes: 60
    # No cancellation and no ref in the group: a nightly run that never
    # finishes is the whole problem this job exists to solve. Two of them
    # overlapping is not a scenario worth optimising for.
    concurrency:
      group: nightly-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Boot the built game in Chromium behind a synthetic pad and play a wave.
      - run: npx playwright install --with-deps chromium
      - run: node tools/run-suites.mjs --shard=${{ matrix.shard }}/4
      # A suite that failed and then passed on the retry did not fail the step
      # above -- a nightly turned red by a test that passes on a re-run is how
      # a red nightly stops meaning anything. It is flagged instead: the runner
      # writes a warning annotation onto the run summary, and the report is
      # kept here so the fix has the failing checks to work from. `always()`
      # because the interesting case is a shard that also had a real failure.
      - name: Keep the flaky-suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report-shard-${{ matrix.shard }}
          path: flaky-report.json
          if-no-files-found: ignore
          retention-days: 30

  # The audits, in their own job rather than after the suites.
  #
  # They used to be the last two steps of the one nightly job, which meant a
  # failing suite skipped them: on run 199 a single check in test-block failed
  # and neither audit ran at all, so nobody learned anything about the boards
  # that night. They are quick — nine seconds for both — and they answer a
  # different question from the suites, so they should not be able to lose
  # their turn to one. `if: always()` on the second does the same for the two
  # of them between themselves.
  #
  # `audit:hitboxes` and `audit:props` are deliberately NOT here. They exist as
  # npm scripts and nothing runs them; whether they are green on `main` today
  # is not known, and a nightly is the wrong place to find out. Run them by
  # hand first, and add them here once they are.
  audits:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nightly-audits
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Every board's props measured against its colliders: nothing that looks
      # solid may be walked through, and no collider may sit on empty air.
      - run: npm run audit:boards
      # Every wave on every board, planned and measured: no hostile may be
      # posted inside the scenery it is supposed to fight in front of.
      - run: npm run audit:spawns
        if: always()
