<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8b04a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0524a"/>
    </marker>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#ffc35a" stop-opacity=".6"/>
      <stop offset=".6" stop-color="#ffb040" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffb040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flare">
      <stop offset="0" stop-color="#fff2b0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff2b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="egg">
      <stop offset="0" stop-color="#c8e07a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c8e07a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="web" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d7dbe0" stroke-width="1.4"/>
    </pattern>
    <g id="cam">
      <rect x="-9" y="-6" width="13" height="12" rx="2" fill="#e9ecef"/>
      <path d="M4,-3 L10,-7 L10,7 L4,3 z" fill="#e9ecef"/>
    </g>
    <path id="kr" d="M0,-7 L6.5,5 L-6.5,5 z" fill="#e0524a"/>
    <g id="sac"><circle r="9" fill="url(#egg)"/><ellipse rx="4" ry="5" fill="#c8e07a" fill-opacity=".55"/></g>
    <g id="brz"><rect x="-6" y="-6" width="12" height="12" rx="2" fill="#b48cff"/></g>
    <g id="brzLit"><circle r="11" fill="none" stroke="#7bd389" stroke-width="2"/><rect x="-6" y="-6" width="12" height="12" rx="2" fill="#b48cff"/><path d="M0,-4 C3,-1 2,3 0,4 C-2,3 -3,-1 0,-4z" fill="#ffc35a"/></g>
  </defs>

  <rect width="1200" height="720" fill="#15171c"/>

  <!-- header -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#f2efe6">08 · Lamplight</text>
  <text x="40" y="78" font-size="16" fill="#9aa3ad">Crevasse · darkness · ~4 min</text>
  <text x="560" y="78" font-size="12" letter-spacing="2" fill="#6f7883">PLAN · TO SCALE</text>

  <!-- ===== cave shell: tunnels then chambers ===== -->
  <g fill="none" stroke-linecap="butt">
    <!-- tunnel walls -->
    <path d="M105,400 L55,468" stroke="#4a4f58" stroke-width="28"/>
    <path d="M270,352 L362,380" stroke="#4a4f58" stroke-width="28"/>
    <path d="M580,366 L672,340" stroke="#4a4f58" stroke-width="28"/>
    <path d="M760,230 L760,150" stroke="#4a4f58" stroke-width="28"/>
    <path d="M105,400 L55,468" stroke="#1d2024" stroke-width="18"/>
    <path d="M270,352 L362,380" stroke="#1d2024" stroke-width="18"/>
    <path d="M580,366 L672,340" stroke="#1d2024" stroke-width="18"/>
    <path d="M760,230 L760,150" stroke="#1d2024" stroke-width="18"/>
  </g>
  <g stroke="#4a4f58" stroke-width="5" fill="#2a2d33">
    <ellipse cx="175" cy="330" rx="112" ry="104"/>
    <ellipse cx="470" cy="390" rx="124" ry="116"/>
    <ellipse cx="760" cy="320" rx="100" ry="100"/>
  </g>
  <!-- floor: #3a3f48 under near-zero ambient -->
  <g fill="#1d2024">
    <ellipse cx="175" cy="330" rx="106" ry="98"/>
    <ellipse cx="470" cy="390" rx="118" ry="110"/>
    <ellipse cx="760" cy="320" rx="94" ry="94"/>
    <path d="M100,394 L112,405 L65,470 L48,462 Z"/>
    <path d="M268,343 L365,372 L360,389 L266,360 Z"/>
    <path d="M578,357 L672,331 L676,349 L583,375 Z"/>
    <rect x="751" y="150" width="18" height="80"/>
  </g>

  <!-- ===== chamber A: 3/3 lit, exit open ===== -->
  <circle cx="118" cy="282" r="36" fill="url(#warm)"/>
  <circle cx="232" cy="284" r="36" fill="url(#warm)"/>
  <circle cx="176" cy="388" r="36" fill="url(#warm)"/>
  <use href="#brzLit" x="118" y="282"/>
  <use href="#brzLit" x="232" y="284"/>
  <use href="#brzLit" x="176" y="388"/>
  <use href="#sac" x="90" y="352"/>
  <use href="#sac" x="250" y="378"/>
  <use href="#sac" x="178" y="250"/>
  <line x1="314" y1="347" x2="310" y2="376" stroke="#7bd389" stroke-width="3"/>

  <!-- ===== chamber B: the party, back to back ===== -->
  <!-- lit brazier -->
  <circle cx="398" cy="452" r="36" fill="url(#warm)"/>
  <use href="#brzLit" x="398" y="452"/>
  <use href="#brz" x="400" y="320"/>
  <use href="#brz" x="552" y="462"/>
  <!-- nest + flare -->
  <use href="#sac" x="516" y="300"/>
  <use href="#sac" x="534" y="312"/>
  <use href="#sac" x="522" y="320"/>
  <circle cx="528" cy="310" r="40" fill="url(#flare)"/>
  <circle cx="528" cy="310" r="4" fill="#fff2b0"/>
  <path d="M470,370 Q490,318 522,308" fill="none" stroke="#fff2b0" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- lamp cones -->
  <path d="M470,370 L432,288 A90,90 0 0 1 508,288 Z" fill="#fff2b0" fill-opacity=".18"/>
  <path d="M470,406 L508,488 A90,90 0 0 1 432,488 Z" fill="#fff2b0" fill-opacity=".18"/>
  <path d="M454,388 L372,426 A90,90 0 0 1 372,350 Z" fill="#fff2b0" fill-opacity=".18"/>
  <path d="M486,388 L595,373 A110,110 0 0 1 595,403 Z" fill="#fff2b0" fill-opacity=".42"/>
  <!-- camera behind player 4 (closer than usual) -->
  <path d="M470,389 L400,368 L400,410 Z" fill="#e9ecef" fill-opacity=".1"/>
  <!-- krykna at the edge of the light -->
  <use href="#kr" x="360" y="394"/>
  <use href="#kr" x="424" y="346"/>
  <use href="#kr" x="518" y="472"/>
  <use href="#kr" x="564" y="346"/>
  <g transform="translate(578,390)">
    <use href="#kr"/>
    <path d="M0,-17 L2,-11 M9,-13 L5,-9 M-9,-13 L-5,-9" stroke="#fff2b0" stroke-width="2"/>
  </g>
  <path d="M360,410 Q372,445 386,470" fill="none" stroke="#e0524a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrR)"/>
  <path d="M424,330 Q435,305 450,300" fill="none" stroke="#e0524a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrR)"/>
  <path d="M560,338 L578,326" fill="none" stroke="#e0524a" stroke-width="1.8" marker-start="url(#arrR)" transform="translate(6,6)"/>
  <!-- players -->
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <g transform="translate(470,372)"><circle r="9" fill="#3ec1b0" stroke="#0e3b36" stroke-width="2"/><text y="4">1</text></g>
    <g transform="translate(487,389)"><circle r="9" fill="#3ec1b0" stroke="#0e3b36" stroke-width="2"/><text y="4">2</text></g>
    <g transform="translate(470,406)"><circle r="9" fill="#3ec1b0" stroke="#0e3b36" stroke-width="2"/><text y="4">3</text></g>
    <g transform="translate(453,389)"><circle r="9" fill="#3ec1b0" stroke="#0e3b36" stroke-width="2"/><text y="4">4</text></g>
  </g>
  <use href="#cam" x="470" y="389" transform="rotate(180 470 389) translate(-3,0)"/>
  <!-- B exit web (sealed until 3/3) -->
  <rect x="586" y="350" width="10" height="26" fill="url(#web)" stroke="#d7dbe0" stroke-width="1" transform="rotate(-16 591 363)"/>

  <!-- ===== chamber C: dark, brood bold ===== -->
  <use href="#brz" x="702" y="282"/>
  <use href="#brz" x="824" y="300"/>
  <use href="#brz" x="760" y="392"/>
  <use href="#sac" x="712" y="360"/>
  <use href="#sac" x="812" y="360"/>
  <use href="#sac" x="786" y="252"/>
  <use href="#kr" x="730" y="316"/>
  <use href="#kr" x="752" y="340"/>
  <use href="#kr" x="788" y="318"/>
  <use href="#kr" x="772" y="362"/>
  <use href="#kr" x="738" y="372"/>
  <use href="#kr" x="806" y="336"/>
  <use href="#kr" x="760" y="296"/>
  <!-- exit web wall -->
  <rect x="744" y="218" width="32" height="14" fill="url(#web)" stroke="#d7dbe0" stroke-width="1"/>

  <!-- golden path -->
  <g fill="none" stroke="#e8b04a" stroke-width="3" stroke-dasharray="8 5">
    <path d="M62,456 L100,404" marker-end="url(#arr)"/>
    <path d="M276,354 L350,377" marker-end="url(#arr)"/>
    <path d="M598,360 L664,342" marker-end="url(#arr)"/>
    <path d="M760,212 L760,160" marker-end="url(#arr)"/>
  </g>

  <!-- labels -->
  <g font-size="13" fill="#d7dbe0" text-anchor="middle">
    <text x="175" y="458">CHAMBER A · ~36 m</text>
    <text x="470" y="530">CHAMBER B · ~40 m</text>
    <text x="760" y="444">CHAMBER C · ~32 m</text>
  </g>
  <g font-size="12" fill="#9aa3ad" text-anchor="middle">
    <text x="175" y="474">3/3 lit · exit open</text>
    <text x="470" y="546">1/3 lit · exit webbed</text>
    <text x="760" y="460">0/3 lit · brood bold</text>
    <text x="316" y="330">crawl tunnel</text>
    <text x="626" y="322">crawl tunnel</text>
  </g>
  <g font-size="12" fill="#9aa3ad">
    <text x="40" y="496">from queen tunnel</text>
    <text x="786" y="214">web wall · burns</text>
    <text x="786" y="160">to the hatchery</text>
    <text x="604" y="410">dazzled</text>
    <text x="542" y="262">flare · 20 s</text>
  </g>

  <!-- callouts -->
  <g font-size="13" font-weight="700" fill="#15171c" text-anchor="middle">
    <g transform="translate(372,300)"><circle r="11" fill="#e8b04a"/><text y="4.5">1</text></g>
    <g transform="translate(620,388)"><circle r="11" fill="#e8b04a"/><text y="4.5">2</text></g>
    <g transform="translate(398,500)"><circle r="11" fill="#e8b04a"/><text y="4.5">3</text></g>
    <g transform="translate(296,392)"><circle r="11" fill="#e8b04a"/><text y="4.5">4</text></g>
    <g transform="translate(846,390)"><circle r="11" fill="#e8b04a"/><text y="4.5">5</text></g>
    <g transform="translate(508,258)"><circle r="11" fill="#e8b04a"/><text y="4.5">6</text></g>
    <g transform="translate(728,198)"><circle r="11" fill="#e8b04a"/><text y="4.5">7</text></g>
  </g>

  <!-- scale bar -->
  <g font-size="12" fill="#6f7883">
    <line x1="700" y1="632" x2="760" y2="632" stroke="#6f7883" stroke-width="2"/>
    <line x1="700" y1="626" x2="700" y2="638" stroke="#6f7883" stroke-width="2"/>
    <line x1="760" y1="626" x2="760" y2="638" stroke="#6f7883" stroke-width="2"/>
    <text x="768" y="636">0 — 10 m</text>
  </g>
  <text x="40" y="600" font-size="13" fill="#d7dbe0">Warm pool = 12 m across · spiders will not enter · a lit brazier is a checkpoint.</text>
  <text x="40" y="620" font-size="13" fill="#9aa3ad">Four lamps, four directions: the party learns to stand back to back.</text>

  <!-- ===== notes column ===== -->
  <g font-size="13" fill="#d7dbe0">
    <g transform="translate(922,120)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">1</text></g>
    <text x="940" y="125">Darkness (K9): ambient ≈ 0;</text>
    <text x="940" y="142">helmet lamp is a spotlight</text>
    <text x="940" y="159">along aim — see what you point at</text>

    <g transform="translate(922,190)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">2</text></g>
    <text x="940" y="195">Hold aim = focused beam; 1.5 s</text>
    <text x="940" y="212">on a krykna → dazzled (2 s stun,</text>
    <text x="940" y="229">×2 dmg); drains the battery</text>

    <g transform="translate(922,260)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">3</text></g>
    <text x="940" y="265">Brazier: interact 2 s → permanent</text>
    <text x="940" y="282">12 m warm pool + checkpoint</text>

    <g transform="translate(922,313)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">4</text></g>
    <text x="940" y="318">3 of 3 lit → the webs shrink</text>
    <text x="940" y="335">back and the exit opens</text>

    <g transform="translate(922,366)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">5</text></g>
    <text x="940" y="371">60 s with no new brazier → the</text>
    <text x="940" y="388">brood stops fearing lamps</text>
    <text x="940" y="405">(solo: 90 s, smaller swarm)</text>

    <g transform="translate(922,436)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">6</text></g>
    <text x="940" y="441">Flare (Q): 20 s moving light,</text>
    <text x="940" y="458">tossed into a nest pushes the</text>
    <text x="940" y="475">swarm back</text>

    <g transform="translate(922,506)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">7</text></g>
    <text x="940" y="511">Web wall burns → hatchery</text>

    <use href="#cam" x="922" y="544"/>
    <text x="940" y="548">Per-player cam, slightly closer</text>
    <text x="940" y="565">than usual</text>
    <text x="940" y="592" fill="#9aa3ad">Fail: re-form at the last</text>
    <text x="940" y="609" fill="#9aa3ad">lit brazier</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="13" fill="#9aa3ad">
    <rect x="40" y="681" width="18" height="12" fill="#1d2024" stroke="#4a4f58" stroke-width="2"/>
    <text x="64" y="692">dark cave floor</text>
    <use href="#brzLit" x="184" y="687"/>
    <text x="200" y="692">lit brazier</text>
    <use href="#brz" x="284" y="687"/>
    <text x="296" y="692">unlit</text>
    <circle cx="350" cy="687" r="10" fill="url(#warm)"/>
    <text x="364" y="692">warm pool</text>
    <path d="M436,687 L456,679 L456,695 Z" fill="#fff2b0" fill-opacity=".35"/>
    <text x="462" y="692">lamp cone</text>
    <circle cx="540" cy="687" r="8" fill="#3ec1b0" stroke="#0e3b36" stroke-width="2"/>
    <text x="554" y="692">player</text>
    <use href="#kr" x="614" y="689"/>
    <text x="628" y="692">krykna</text>
    <use href="#sac" x="690" y="687"/>
    <text x="704" y="692">egg sac</text>
    <rect x="764" y="681" width="16" height="12" fill="url(#web)" stroke="#d7dbe0"/>
    <text x="786" y="692">web</text>
    <line x1="822" y1="679" x2="822" y2="695" stroke="#7bd389" stroke-width="3"/>
    <text x="832" y="692">open exit</text>
    <use href="#cam" x="908" y="687"/>
    <text x="924" y="692">camera</text>
    <line x1="984" y1="687" x2="1010" y2="687" stroke="#e8b04a" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <text x="1018" y="692">route</text>
  </g>
</svg>
