<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8b04a"/>
    </marker>
    <marker id="arrH" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6a3d"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0524a"/>
    </marker>
    <g id="cam">
      <rect x="-9" y="-6" width="13" height="12" rx="2" fill="#e9ecef"/>
      <path d="M4,-3 L10,-7 L10,7 L4,3 z" fill="#e9ecef"/>
    </g>
    <path id="qr" d="M0,-7 L6,0 L0,7 L-6,0 z" fill="#e0524a"/>
    <g id="crate"><rect x="-6" y="-6" width="12" height="12" fill="#7a6446" stroke="#a88a5e" stroke-width="1"/></g>
    <pattern id="planks" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#3a3f48"/>
      <line x1="7.5" y1="0" x2="7.5" y2="8" stroke="#4a4f58" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="#15171c"/>

  <!-- header -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#f2efe6">10 · Run the Pier</text>
  <text x="40" y="78" font-size="16" fill="#9aa3ad">Storm Docks · chase toward camera · ~75 s</text>

  <!-- ===== OVERVIEW: whole 600 m chain ===== -->
  <text x="40" y="112" font-size="12" letter-spacing="2" fill="#6f7883">PLAN · WHOLE CHAIN · LENGTH TO SCALE, WIDTH ×4</text>
  <rect x="40" y="148" width="850" height="84" rx="6" fill="#1f3a44"/>

  <!-- section 1 already collapsed behind the front -->
  <rect x="60" y="170" width="256" height="40" fill="#3a3f48" fill-opacity=".35" stroke="#5a616d" stroke-dasharray="4 3"/>
  <rect x="316" y="170" width="44" height="40" fill="#3a3f48" fill-opacity=".35" stroke="#5a616d" stroke-dasharray="4 3"/>
  <!-- live pier -->
  <rect x="330" y="170" width="270" height="40" fill="url(#planks)" stroke="#5a616d"/>
  <rect x="616" y="170" width="254" height="40" fill="url(#planks)" stroke="#5a616d"/>
  <!-- collapsed 10 m on section 2 -->
  <rect x="471" y="168" width="14" height="44" fill="#1f3a44"/>
  <!-- warehouse on section 3 -->
  <rect x="694" y="158" width="81" height="64" fill="#2a2d33" stroke="#4a4f58" stroke-width="3"/>
  <rect x="696" y="170" width="77" height="40" fill="#3a3f48" stroke="#5a616d" stroke-dasharray="3 3"/>
  <!-- obstacles -->
  <use href="#crate" x="140" y="184"/><use href="#crate" x="250" y="196"/>
  <use href="#crate" x="384" y="182"/><use href="#crate" x="650" y="196"/><use href="#crate" x="820" y="184"/>
  <g stroke="#b9bec6" stroke-width="2"><line x1="195" y1="172" x2="195" y2="196"/><line x1="424" y1="184" x2="424" y2="208"/><line x1="816" y1="196" x2="816" y2="208"/><line x1="846" y1="172" x2="846" y2="196"/></g>
  <circle cx="445" cy="190" r="6" fill="#ff6a3d" fill-opacity=".4" stroke="#ff6a3d" stroke-dasharray="3 2"/>
  <!-- gates G1..G3 at the section starts -->
  <g stroke="#7bd389" stroke-width="3">
    <line x1="64" y1="164" x2="64" y2="216"/>
    <line x1="334" y1="164" x2="334" y2="216"/>
    <line x1="620" y1="164" x2="620" y2="216"/>
  </g>
  <!-- front + mamacore -->
  <rect x="60" y="166" width="300" height="48" fill="#ff6a3d" fill-opacity=".22"/>
  <line x1="360" y1="162" x2="360" y2="218" stroke="#ff6a3d" stroke-width="3"/>
  <circle cx="342" cy="190" r="12" fill="#e0524a"/>
  <!-- party + camera snapshot -->
  <g fill="#3ec1b0" stroke="#0e3b36" stroke-width="1.5">
    <circle cx="374" cy="194" r="4.5"/><circle cx="392" cy="186" r="4.5"/><circle cx="400" cy="198" r="4.5"/><circle cx="408" cy="184" r="4.5"/>
  </g>
  <use href="#cam" x="508" y="160" transform="rotate(180 508 160)"/>
  <!-- ends -->
  <text x="46" y="246" font-size="12" fill="#9aa3ad">from pier heads camp</text>
  <line x1="872" y1="190" x2="886" y2="190" stroke="#e8b04a" stroke-width="3" marker-end="url(#arr)"/>
  <text x="890" y="246" font-size="12" fill="#9aa3ad" text-anchor="end">to the mamacore pool</text>
  <!-- section labels -->
  <g font-size="12" fill="#d7dbe0" text-anchor="middle">
    <text x="188" y="140">SECTION 1 · ~190 m</text>
    <text x="465" y="140">SECTION 2 · ~205 m</text>
    <text x="734" y="140">SECTION 3 · ~195 m (warehouse)</text>
  </g>
  <g font-size="11" fill="#9aa3ad" text-anchor="middle">
    <text x="323" y="244">gap 5 m</text>
    <text x="608" y="244">gap 6 m</text>
  </g>
  <!-- distance ruler -->
  <g stroke="#6f7883" stroke-width="1.5">
    <line x1="60" y1="262" x2="870" y2="262"/>
    <line x1="60" y1="258" x2="60" y2="266"/><line x1="195" y1="258" x2="195" y2="266"/><line x1="330" y1="258" x2="330" y2="266"/>
    <line x1="465" y1="258" x2="465" y2="266"/><line x1="600" y1="258" x2="600" y2="266"/><line x1="735" y1="258" x2="735" y2="266"/><line x1="870" y1="258" x2="870" y2="266"/>
  </g>
  <g font-size="11" fill="#6f7883" text-anchor="middle">
    <text x="60" y="280">0</text><text x="195" y="280">100</text><text x="330" y="280">200</text><text x="465" y="280">300</text>
    <text x="600" y="280">400</text><text x="735" y="280">500</text><text x="870" y="280">600 m</text>
  </g>
  <!-- inset bracket -->
  <rect x="330" y="154" width="182" height="72" fill="none" stroke="#e9ecef" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M330,226 L40,300 M512,226 L890,300" stroke="#e9ecef" stroke-opacity=".25" fill="none"/>

  <!-- ===== INSET: the rail frame, 200–335 m ===== -->
  <rect x="40" y="300" width="850" height="350" rx="6" fill="#1f3a44"/>
  <text x="56" y="322" font-size="12" letter-spacing="2" fill="#9aa3ad">INSET · THE RAIL FRAME · 200–335 m · TO SCALE</text>

  <!-- pier -->
  <rect x="192" y="460" width="498" height="60" fill="url(#planks)" stroke="#5a616d"/>
  <rect x="750" y="460" width="140" height="60" fill="url(#planks)" stroke="#5a616d"/>
  <!-- collapsed 10 m section -->
  <path d="M690,460 l6,10 l-4,12 l6,14 l-5,10 l-3,14 M750,460 l-5,12 l5,10 l-6,14 l4,12 l2,12" fill="none" stroke="#5a616d" stroke-width="2"/>
  <path d="M676,470 Q720,408 764,470" fill="none" stroke="#e8b04a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="720" y="542" font-size="12" fill="#d7dbe0" text-anchor="middle">collapsed · 10 m</text>
  <text x="720" y="557" font-size="12" fill="#9aa3ad" text-anchor="middle">jetpack jump</text>

  <!-- collapse front + mamacore behind -->
  <rect x="56" y="440" width="136" height="100" fill="#ff6a3d" fill-opacity=".38" stroke="#ff6a3d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g stroke="#5a616d" stroke-width="3">
    <line x1="160" y1="466" x2="178" y2="474"/><line x1="150" y1="506" x2="172" y2="500"/><line x1="70" y1="470" x2="86" y2="480"/>
  </g>
  <line x1="192" y1="436" x2="192" y2="544" stroke="#ff6a3d" stroke-width="4"/>
  <circle cx="128" cy="490" r="38" fill="#e0524a"/>
  <ellipse cx="136" cy="490" rx="22" ry="16" fill="#15171c"/>
  <g fill="#f2efe6"><path d="M120,476 l4,8 l4,-8z M132,475 l4,8 l4,-8z M144,477 l4,8 l4,-8z M122,504 l4,-8 l4,8z M136,505 l4,-8 l4,8z"/></g>
  <text x="124" y="428" font-size="13" font-weight="700" fill="#f2efe6" text-anchor="middle">MAMACORE</text>
  <line x1="200" y1="446" x2="236" y2="446" stroke="#ff6a3d" stroke-width="2.5" marker-end="url(#arrH)"/>
  <text x="200" y="436" font-size="12" fill="#d7dbe0">front</text>
  <path d="M150,562 L90,562" stroke="#e0524a" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="60" y="582" font-size="12" fill="#d7dbe0">stagger: drops back 10 m</text>

  <!-- camera frame footprint (leash) -->
  <path d="M852,404 L200,372 L200,610 Z" fill="#e9ecef" fill-opacity=".08"/>
  <path d="M790,452 L790,528 L200,556 L200,424 Z" fill="none" stroke="#e9ecef" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="206" y="378" font-size="12" fill="#d7dbe0">frame rear (leash) — behind it = caught</text>
  <text x="784" y="604" font-size="12" fill="#d7dbe0" text-anchor="end">leading edge: caught player re-forms here after 3 s</text>
  <line x1="700" y1="592" x2="786" y2="530" stroke="#e9ecef" stroke-opacity=".4"/>

  <!-- obstacles -->
  <use href="#crate" x="296" y="474"/><use href="#crate" x="308" y="474"/><use href="#crate" x="302" y="486"/>
  <text x="302" y="538" font-size="12" fill="#9aa3ad" text-anchor="middle">crates · hop</text>
  <g stroke="#b9bec6" stroke-width="2">
    <line x1="480" y1="462" x2="480" y2="500"/><line x1="486" y1="462" x2="486" y2="500"/>
  </g>
  <g stroke="#b9bec6" stroke-width="1"><line x1="480" y1="470" x2="486" y2="470"/><line x1="480" y1="480" x2="486" y2="480"/><line x1="480" y1="490" x2="486" y2="490"/></g>
  <text x="483" y="538" font-size="12" fill="#9aa3ad" text-anchor="middle">fish rack · duck / round</text>
  <!-- crane with swinging load -->
  <rect x="560" y="446" width="20" height="14" fill="#2a2d33" stroke="#4a4f58" stroke-width="2"/>
  <path d="M539.6,483.4 A43,43 0 0 0 600.4,483.4" fill="none" stroke="#ff6a3d" stroke-width="1.8" stroke-dasharray="4 3" marker-start="url(#arrH)" marker-end="url(#arrH)"/>
  <line x1="570" y1="453" x2="584" y2="494" stroke="#b9bec6" stroke-width="1.5"/>
  <circle cx="584" cy="494" r="11" fill="#ff6a3d" fill-opacity=".42" stroke="#ff6a3d" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="570" y="438" font-size="12" fill="#9aa3ad" text-anchor="middle">crane load swings</text>

  <!-- quarren blockers ahead -->
  <use href="#qr" x="620" y="478"/>
  <use href="#qr" x="648" y="506"/>
  <use href="#qr" x="810" y="490"/>

  <!-- players -->
  <g stroke="#3ec1b0" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="244" y1="492" x2="168" y2="490"/>
    <line x1="244" y1="498" x2="170" y2="498"/>
  </g>
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <g transform="translate(252,496)"><circle r="9" fill="#3ec1b0" stroke="#0e3b36" stroke-width="2"/><text y="4">4</text></g>
    <g transform="translate(342,505)"><circle r="9" fill="#3ec1b0" stroke="#0e3b36" stroke-width="2"/><text y="4">3</text></g>
    <g transform="translate(372,480)"><circle r="9" fill="#3ec1b0" stroke="#0e3b36" stroke-width="2"/><text y="4">2</text></g>
    <g transform="translate(408,500)"><circle r="9" fill="#3ec1b0" stroke="#0e3b36" stroke-width="2"/><text y="4">1</text></g>
  </g>
  <line x1="420" y1="490" x2="452" y2="490" stroke="#e8b04a" stroke-width="3" marker-end="url(#arr)"/>

  <!-- the reversed rail camera -->
  <use href="#cam" x="852" y="404" transform="rotate(180 852 404)"/>
  <text x="874" y="360" font-size="12" fill="#f2efe6" text-anchor="end">rail cam, reversed</text>
  <text x="874" y="376" font-size="12" fill="#9aa3ad" text-anchor="end">ahead · high · to the side</text>
  <text x="874" y="392" font-size="12" fill="#9aa3ad" text-anchor="end">looking back</text>

  <!-- inset scale -->
  <g font-size="12" fill="#9aa3ad">
    <line x1="60" y1="628" x2="180" y2="628" stroke="#9aa3ad" stroke-width="2"/>
    <line x1="60" y1="622" x2="60" y2="634" stroke="#9aa3ad" stroke-width="2"/>
    <line x1="180" y1="622" x2="180" y2="634" stroke="#9aa3ad" stroke-width="2"/>
    <text x="188" y="632">0 — 20 m</text>
  </g>

  <!-- callouts -->
  <g font-size="13" font-weight="700" fill="#15171c" text-anchor="middle">
    <g transform="translate(256,446)"><circle r="11" fill="#e8b04a"/><text y="4.5">1</text></g>
    <g transform="translate(234,530)"><circle r="11" fill="#e8b04a"/><text y="4.5">2</text></g>
    <g transform="translate(634,456)"><circle r="11" fill="#e8b04a"/><text y="4.5">3</text></g>
    <g transform="translate(526,494)"><circle r="11" fill="#e8b04a"/><text y="4.5">4</text></g>
    <g transform="translate(720,428)"><circle r="11" fill="#e8b04a"/><text y="4.5">5</text></g>
    <g transform="translate(734,240)"><circle r="11" fill="#e8b04a"/><text y="4.5">6</text></g>
    <g transform="translate(90,140)"><circle r="11" fill="#e8b04a"/><text y="4.5">7</text></g>
  </g>

  <!-- ===== notes column ===== -->
  <g font-size="13" fill="#d7dbe0">
    <g transform="translate(922,120)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">1</text></g>
    <text x="940" y="125">Front (K4): pier collapses into</text>
    <text x="940" y="142">the mouth ~15% under sprint,</text>
    <text x="940" y="159">over jog; stall and you’re caught</text>

    <g transform="translate(922,190)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">2</text></g>
    <text x="940" y="195">Turn and fire: enough damage</text>
    <text x="940" y="212">staggers it back 10 m — spend</text>
    <text x="940" y="229">your lead to buy the others time</text>

    <g transform="translate(922,260)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">3</text></g>
    <text x="940" y="265">Quarren blockers ahead: dash</text>
    <text x="940" y="282">shoulders them flat</text>

    <g transform="translate(922,313)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">4</text></g>
    <text x="940" y="318">Crate stacks (hop), fish racks</text>
    <text x="940" y="335">(duck/round), crane’s load</text>

    <g transform="translate(922,366)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">5</text></g>
    <text x="940" y="371">Collapsed section: 10 m</text>
    <text x="940" y="388">jetpack jump</text>

    <g transform="translate(922,419)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">6</text></g>
    <text x="940" y="424">Warehouse: in one door, out</text>
    <text x="940" y="441">the other — the camera follows</text>

    <g transform="translate(922,472)"><circle r="10" fill="#e8b04a"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#15171c">7</text></g>
    <text x="940" y="477">3 sections, 4–6 m gaps; 3 gates.</text>
    <text x="940" y="494">All caught → reset to last gate;</text>
    <text x="940" y="511">2 s safe on reaching a gate</text>

    <use href="#cam" x="922" y="546"/>
    <text x="940" y="550">One screen (K1, reversed):</text>
    <text x="940" y="567">behind the frame’s rear =</text>
    <text x="940" y="584">caught; re-form at the leading</text>
    <text x="940" y="601">edge after 3 s (time + HP)</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="13" fill="#9aa3ad">
    <rect x="40" y="681" width="18" height="12" fill="url(#planks)" stroke="#5a616d"/>
    <text x="64" y="692">pier</text>
    <rect x="106" y="681" width="18" height="12" fill="#1f3a44"/>
    <text x="130" y="692">sea</text>
    <circle cx="176" cy="687" r="8" fill="#3ec1b0" stroke="#0e3b36" stroke-width="2"/>
    <text x="190" y="692">player</text>
    <use href="#qr" x="250" y="687"/>
    <text x="262" y="692">quarren</text>
    <circle cx="332" cy="687" r="8" fill="#e0524a"/>
    <text x="346" y="692">mamacore</text>
    <rect x="422" y="681" width="18" height="12" fill="#ff6a3d" fill-opacity=".4" stroke="#ff6a3d" stroke-dasharray="4 3"/>
    <text x="446" y="692">collapse / hazard</text>
    <use href="#crate" x="570" y="687"/>
    <text x="582" y="692">crates</text>
    <line x1="636" y1="679" x2="636" y2="697" stroke="#7bd389" stroke-width="3"/>
    <text x="646" y="692">gate (×3)</text>
    <use href="#cam" x="724" y="687" transform="rotate(180 724 687)"/>
    <text x="740" y="692">rail camera</text>
    <path d="M820,681 L820,693 L850,697 L850,677 Z" fill="none" stroke="#e9ecef" stroke-opacity=".6" stroke-dasharray="4 3"/>
    <text x="858" y="692">frame (leash)</text>
    <line x1="960" y1="687" x2="986" y2="687" stroke="#e8b04a" stroke-width="3" marker-end="url(#arr)"/>
    <text x="994" y="692">run direction</text>
  </g>
</svg>
