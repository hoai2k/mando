<text x="700" y="221" font-size="13" fill="#d7dbe0">6 m of her · half speed while a bellows is broken</text>
<g><circle cx="710" cy="262" r="10" fill="#e8b04a"/><text x="710" y="266.2" font-size="12" font-weight="700" fill="#15171c" text-anchor="middle">1</text></g>
<text x="726" y="266" font-size="13" fill="#d7dbe0">Forge on the dais; the Armorer works it. She has HP, fights back with</text>
<text x="726" y="282" font-size="13" fill="#d7dbe0">her hammer, never leaves the dais; re-forms after 10 s</text>
<g><circle cx="710" cy="303" r="10" fill="#e8b04a"/><text x="710" y="307.2" font-size="12" font-weight="700" fill="#15171c" text-anchor="middle">2</text></g>
<text x="726" y="307" font-size="13" fill="#d7dbe0">6 m stall radius around her — any enemy inside stops the bar</text>
<g><circle cx="710" cy="328" r="10" fill="#e8b04a"/><text x="710" y="332.2" font-size="12" font-weight="700" fill="#15171c" text-anchor="middle">3</text></g>
<text x="726" y="332" font-size="13" fill="#d7dbe0">Two bellows on the dais flanks: enemy targets; repair = hold</text>
<text x="726" y="348" font-size="13" fill="#d7dbe0">interact 4 s</text>
<g><circle cx="710" cy="369" r="10" fill="#e8b04a"/><text x="710" y="373.2" font-size="12" font-weight="700" fill="#15171c" text-anchor="middle">4</text></g>
<text x="726" y="373" font-size="13" fill="#d7dbe0">Six barricade sockets: beskar shields, waist-high, three up at</text>
<text x="726" y="389" font-size="13" fill="#d7dbe0">once, re-placeable — block bolts, channel the melee kinds</text>
<g><circle cx="710" cy="410" r="10" fill="#e8b04a"/><text x="710" y="414.2" font-size="12" font-weight="700" fill="#15171c" text-anchor="middle">5</text></g>
<text x="726" y="414" font-size="13" fill="#d7dbe0">Waves alternate passes (N / E / W); solo: one pass per wave</text>
<g><circle cx="710" cy="435" r="10" fill="#e8b04a"/><text x="710" y="439.2" font-size="12" font-weight="700" fill="#15171c" text-anchor="middle">6</text></g>
<text x="726" y="439" font-size="13" fill="#d7dbe0">Final wave: all three passes at once + the alamite chieftain</text>
<text x="726" y="464" font-size="13" fill="#d7dbe0">At 100% each hunter gets a beskar piece (+25 max HP, whole run).</text>
<text x="726" y="480" font-size="13" fill="#d7dbe0">Deaths re-form at the dais — slowed, never lost.</text>
